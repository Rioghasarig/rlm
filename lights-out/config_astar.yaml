board:
  n: 5                          # board side length (n×n grid)
  init_set:                     # set of starting boards built with SquareLightsBoard.scramble
    num_boards: 30              # number of distinct random solvable boards to generate
    scramble_k: 10              # random presses applied to the all-off state to scramble each board
    seed: null                  # RNG seed for reproducible board-set construction; null → nondeterministic

network:
  res_blocks: 2                 # residual blocks in the policy tower
  filters: 32                   # convolutional filters per block

optimizer:
  learning_rate: 0.0003

dagger:
  n_iterations: 50              # DAgger outer iterations
  epochs: 10                    # supervised-learning epochs per iteration
  batch_size: 128               # mini-batch size for learn()
  astar_max_expansions: 10000   # node-expansion budget for the astar teacher; null → search until solved/exhausted
  n_trajectories: 2             # policy rollouts collected per initial board per iteration
  max_dataset_size: 5000        # oldest samples evicted when exceeded; null → unlimited
  save_path: policy_model_astar.keras  # checkpoint path; set to null to disable
  load_path: null               # resume from this .keras file; null → fresh model
  n_workers: null               # worker processes for astar labeling; null → all CPUs
  log_dir: runs                 # directory for JSONL progress logs; null → no log written
