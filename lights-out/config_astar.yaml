board:
  n: 5                          # board side length (n×n grid)
  init_set:                     # set of starting boards built with SquareLightsBoard.scramble
    num_boards: 100             # number of distinct random solvable boards to generate
    scramble_k: 10              # random presses applied to the all-off state to scramble each board
    seed: null                  # RNG seed for reproducible board-set construction; null → nondeterministic

network:
  res_blocks: 5                 # residual blocks in the policy tower
  filters: 32                   # convolutional filters per block

optimizer:
  learning_rate: 0.0003

dagger:
  n_iterations: 50              # DAgger outer iterations
  epochs: 1                    # supervised-learning epochs per iteration
  batch_size: 8               # mini-batch size for learn()
  astar_max_expansions: 50    # node-expansion budget for the astar teacher; null → search until solved/exhausted
  n_trajectories: 5             # policy rollouts collected per initial board per iteration
  max_trajectory_length: 10     # cap on states collected per rollout; lane cut off once reached; null → no limit
  max_dataset_size: 5000        # oldest samples evicted when exceeded; null → unlimited
  checkpoint_dir: checkpoints   # directory for per-iteration model checkpoints; null → disable
  model_name: policy_model_astar  # base name for checkpoint files (<model_name>_iter<NNNN>.keras)
  load_path: null               # resume from this .keras file; null → fresh model
  n_workers: 32               # worker processes for astar labeling; null → all CPUs
  log_dir: runs                 # directory for JSONL progress logs; null → no log written
